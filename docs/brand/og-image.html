<!doctype html>
<!-- Source for public/og-image.png (1200×630). Regenerate from the repo root with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=5000 \
       --screenshot=public/og-image.png "file://$PWD/docs/brand/og-image.html" -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  #card {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px;
    background: #022c22; color: #fff; font-family: Inter, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand svg { width: 76px; height: 76px; }
  .name { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .sub { margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 0.22em; text-transform: uppercase; color: #6ee7b7; }
  h1 { margin: 0; font-size: 64px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; max-width: 960px; }
  h1 span { color: #94a3b8; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #94a3b8; }
  .foot b { color: #fff; font-weight: 500; }
</style>
</head>
<body>
<div id="card">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#064e3b" />
      <path d="M8 23V9.5l8 8 8-8V23" fill="none" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="24" cy="23" r="2.9" fill="#34d399" />
    </svg>
    <div>
      <div class="name">Makata</div>
      <div class="sub">AI Edge Lab</div>
    </div>
  </div>
  <h1>AI systems, built under real constraints. <span>Studied on the devices people carry.</span></h1>
  <div class="foot">
    <span>model × compression × retrieval × memory × runtime × device</span>
    <b>makata.ai</b>
  </div>
</div>
</body>
</html>
